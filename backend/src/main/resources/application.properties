# --- Secrets (Constitution II) -------------------------------------------------
# Load the project-root .env (or backend/../.env). Missing files are not an error here;
# ApiKeyStartupCheck fails fast if the key is still blank. A real GOOGLE_API_KEY environment
# variable takes precedence over the file (research R-2).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}

# --- Model (Constitution V: model name lives here, not in code) ------------------
spring.ai.google.genai.chat.model=gemma-4-26b-a4b-it
spring.ai.google.genai.chat.temperature=0.3
spring.ai.google.genai.chat.max-output-tokens=1024

# --- Provider retry cap (research R-7; Spring AI defaults of 10 attempts would break latency)
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.on-client-errors=false

# --- HTTP ----------------------------------------------------------------------
# 8082 in local dev: port 8080 is often taken by other local services (e.g. Jenkins).
# The Vite dev proxy (frontend/vite.config.ts) must point at this same port.
server.port=8082
# Servlet async timeout must exceed the 60 s reply deadline (research R-5).
spring.mvc.async.request-timeout=75s

# --- Support service behaviour (spec FR-015, FR-016, FR-020; research R-8, R-10, R-16)
support.provider.timeout=55s
support.reply.first-token-timeout=30s
support.reply.deadline=60s
support.memory.max-messages=40
support.memory.idle-ttl=2h
support.rate-limit.per-minute=20
support.rate-limit.trust-forwarded-for=false

# --- User authentication (specs/002-user-auth; research A-7, A-8, A-9) ----------------------------
# Accounts are the only durable data. The default is an embedded H2 file in PostgreSQL mode, under
# backend/data/ (git-ignored). Set AUTH_DB_URL, AUTH_DB_USER, and AUTH_DB_PASSWORD in .env to use
# PostgreSQL instead.
spring.datasource.url=${AUTH_DB_URL:jdbc:h2:file:./data/support;MODE=PostgreSQL}
spring.datasource.username=${AUTH_DB_USER:sa}
spring.datasource.password=${AUTH_DB_PASSWORD:}
# schema.sql uses IF NOT EXISTS, so it runs on every start, for H2 and PostgreSQL alike.
spring.sql.init.mode=always
# Idle limit (FR-011). The 7-day absolute limit is enforced by AbsoluteSessionTimeoutFilter.
server.servlet.session.timeout=8h
# The session cookie is HttpOnly and SameSite=Lax (Constitution VI). Secure defaults to true and is
# relaxed only for local HTTP through SESSION_COOKIE_SECURE=false (see .env.example).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# Spring Security logs at WARN, so no password, session, or token is logged at INFO (FR-024).
logging.level.org.springframework.security=WARN

# --- Hygiene (research R-17; Constitution II): the provider key must not reach the logs ---------
management.endpoints.web.exposure.include=
logging.level.org.springframework.ai.chat.client.advisor=WARN
# Spring AI logs a provider failure at ERROR with the full exception message. A provider error
# message could echo credential material, so this logger is silenced. Failures are still reported
# to the customer as fixed codes (ChatErrorMapper). Operators lose these stack traces, a known
# trade-off; re-enable only after the provider's error text is confirmed credential-free.
logging.level.org.springframework.ai.chat.model.MessageAggregator=OFF
