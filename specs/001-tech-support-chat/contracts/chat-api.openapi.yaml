openapi: 3.0.3
info:
  title: Caramel AI Tech Support Chat API
  version: 1.0.0
  description: |
    Draft contract matching prd.md section 8 and Constitution V.
    The streamed body of POST /api/chat is Server-Sent Events; see sse-events.md for
    the event format, which OpenAPI cannot express precisely.
servers:
  - url: http://localhost:8080
paths:
  /api/chat:
    post:
      summary: Send a message and stream the assistant reply
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: >-
            Streamed reply. Events are `token`, then either `done` or `error`.
            See sse-events.md.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream.
        '400':
          description: Invalid request (empty, over 4000 characters, or malformed conversationId).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Another reply is still in progress for this conversationId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Per-client message limit reached.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected failure before streaming began.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Provider unavailable before streaming began.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/chat/{conversationId}:
    delete:
      summary: Clear a conversation's memory (New chat)
      operationId: clearConversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Conversation cleared. Also returned when the conversation did not exist.
        '400':
          description: Malformed conversationId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ChatRequest:
      type: object
      required: [conversationId, message]
      properties:
        conversationId:
          type: string
          format: uuid
          description: Generated by the client. Canonical UUID.
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: Must not be blank after trimming.
    ChatErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - RATE_LIMITED
        - CONVERSATION_BUSY
        - PROVIDER_UNAVAILABLE
        - PROVIDER_RATE_LIMITED
        - TIMEOUT
        - INTERNAL_ERROR
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ChatErrorCode'
        message:
          type: string
          description: Fixed, user-safe text. Never contains provider details or secrets.
        retryAfterSeconds:
          type: integer
          description: Present for RATE_LIMITED.
